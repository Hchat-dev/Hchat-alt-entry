name: Sync Fork with Upstream

on:
  schedule:
    - cron: '0 2 * * *' # 每天 UTC 时间 2:00 (北京时间 10:00) 自动运行
  workflow_dispatch:    # 允许手动点击按钮触发

# 关键修复1：授予写入权限，解决 403 Permission denied
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: git remote add upstream https://github.com/Hchat-dev/Hchat-alt-entry.git

      - name: Fetch upstream
        run: git fetch upstream

      # 关键修复2：配置 Git 身份信息，解决 fatal: empty ident name
      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream changes
        run: |
          git checkout alt-entry
          git merge upstream/alt-entry --no-edit || echo "No changes to merge or merge conflict"

      - name: Push changes to fork
        uses: ad-m/github-push-action@master
        with:
          branch: alt-entry
          force: false
